[package]
name = "wattcoin_core"
version = "2.2.1"
edition = "2024"

[dependencies]
chrono = "0.4"
ed25519-dalek = "2.0"
rand = "0.8"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "socks"] }
warp = "0.3"
num-bigint = "0.4"
randomx-rs = "1.2"
arti-client = { version = "0.19.0", features = ["tokio", "rustls", "onion-service-client"] }
tor-rtcompat = "0.19.0"
rusqlite = { version = "0.31.0", features = ["bundled"] }
sha2 = "0.10.6"
bitcoin = { version = "0.32", features = ["rand-std"] }
pqc_kyber = "0.7.1"
aes-gcm = "0.11.0"
bincode = "1.3"
